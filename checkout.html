<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Campus Bites</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2 class="logo">Campus Bites.</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="order.html">Order</a>
            <a href="cart.html">My Cart</a>
        </nav>
    </header>

    <main class="checkout-page">

        <h1>Complete Your Order</h1>
        <p class="checkout-intro">
            Enter your details and confirm your payment.
        </p>

        <div class="checkout-layout">

            

            <section class="checkout-form-section">

                <h2>Student Information</h2>

                <form id="checkoutForm">

                    <div class="form-group">
                        <label for="studentName">Full Name</label>
                        <input
                            type="text"
                            id="studentName"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="studentID">Student ID</label>
                        <input
                            type="text"
                            id="studentID"
                            placeholder="Enter your student ID"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="studentPhone">Phone Number</label>
                        <input
                            type="tel"
                            id="studentPhone"
                            placeholder="Enter your phone number"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="orderNotes">Order Notes (Optional)</label>
                        <textarea
                            id="orderNotes"
                            placeholder="Any special instructions?"
                            rows="4"
                        ></textarea>
                    </div>

                    <h2 class="payment-heading">Payment Details</h2>

                    <div class="form-group">
                        <label for="amountPaid">Amount Paid (₦)</label>
                        <input
                            type="number"
                            id="amountPaid"
                            placeholder="Enter amount paid"
                            min="1"
                            step="1"
                            required
                        >
                    </div>


                    <button type="submit" id="placeOrderButton">
                        Confirm Payment
                    </button>

                </form>

            </section>


            

            <aside class="checkout-summary">

                <h2>Your Order</h2>

                <div id="checkoutItems"></div>

                <div class="checkout-total">
                    <span>Total Amount</span>
                    <strong id="checkoutTotal">₦0</strong>
                </div>

            </aside>

        </div>

    </main>

    <footer>
        <p>© 2026 Campus Bites. Good Food. Great Moments.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
